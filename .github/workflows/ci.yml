name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: cargo test --release --locked

  build-action-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t amber-shield-scan:ci .
      - name: smoke test the built image
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace amber-shield-scan:ci \
            . none json --report-path /workspace/amber-shield-report.json
          test -f amber-shield-report.json

  dogfood:
    runs-on: ubuntu-latest
    needs: build-action-image
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          fail-on: 'none'
