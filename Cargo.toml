[package]
name = "amber-shield-scan"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Headless vulnerability & secret heatmap scanner (Trivy + GitLeaks) - the CI/Action edition of Amber Shield Lite"
repository = "https://github.com/aurora-ember-bio-lab/amber-shield-scan-action"

[[bin]]
name = "amber-shield-scan"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-javascript = "0.21"
which = "6"

[dev-dependencies]
tempfile = "3"
